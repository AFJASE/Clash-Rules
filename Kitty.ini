;3、节点组
custom_proxy_group=Fastest`url-test`()`http://captive.apple.com`180,,1
custom_proxy_group=HK`url-test`(香港|Kong|HK)`http://captive.apple.com`180,,1
custom_proxy_group=TW`url-test`(台湾|Taiwan|TW)`http://captive.apple.com`180,,1
custom_proxy_group=SG`url-test`(新加坡|Singapore|SG)`http://captive.apple.com`180,,1
custom_proxy_group=JP`url-test`(日本|Japan|JP)`http://captive.apple.com`180,,1
custom_proxy_group=US`url-test`(美国|States|US)`http://captive.apple.com`180,,1
custom_proxy_group=OTR`select`(?=.*())^((?!(香港|台湾|新加坡|日本|美国|Kong|HK|Taiwan|TW|Singapore|SG|Japan|JP|States|US)).)*$`http://captive.apple.com`180,,1

